    content: 每年大约额外250美元，它覆盖个人保险和优步商业保险之间的保障缺口。
  - role: user
    content: 我考虑一下。不确定我是否真的会做网约车。
  - role: assistant
    content: 没问题。您可以随时添加。只是在没有附加条款的情况下不要开优步。
  - role: user
    content: 明白了。租车保障呢？
  - role: assistant
    content: 您的两辆车辆都有租车补偿保障，每天40美元，每次索赔最高1,200美元。
  - role: user
    content: 好的。拖车服务呢？
