  - role: assistant
    content: 您有未投保/投保不足驾驶员保障，额度为10万/30万（原文紧凑记法：100/300），与您的责任险限额一致。
  - role: user
    content: 这在德克萨斯州很重要，有那么多未投保的驾驶员。
  - role: assistant
    content: 确实如此。德克萨斯州大约20%的驾驶员没有保险，所以这项保障至关重要。
  - role: user
    content: 如果我的特斯拉在公共充电站充电时受损怎么办？
  - role: assistant
    content: 如果是被人破坏，属于综合险保障范围；如果是被其他车辆碰撞，属于碰撞险保障范围。
  - role: user
    content: 1000美元免赔额会适用吗？
  - role: assistant
    content: 是的，除非我们能从事故责任方的保险公司获得赔偿。
  - role: user
    content: 我主要在家充电。这有什么影响吗？
  - role: assistant
    content: 家庭充电被认为更安全，这已计入您的费率中。公共充电站的事故正在增加。
