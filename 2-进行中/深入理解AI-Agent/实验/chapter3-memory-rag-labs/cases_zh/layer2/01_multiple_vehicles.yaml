    content: 上班单程大约15英里，所以每天30英里。
  - role: assistant
    content: 年行驶里程估计是多少？
  - role: user
    content: 大概一年12,000英里。
  - role: assistant
    content: 现在来确定保险范围。您的本田有10万/30万/10万美元的责任险（原文紧凑记法：100/300/100）、综合险和碰撞险，免赔额都是500美元。特斯拉想要同样的保障吗？
