user_question: 我需要给我的车安排保养。你能告诉我目前已经安排了哪些服务吗？
evaluation_criteria: '智能体必须识别用户请求中的关键歧义——用户拥有两辆车：一辆2019 Honda Accord和一辆2023 Tesla Model 3。当被问及为"我的车"安排服务时，智能体应通过确认两辆车并提供每辆车的完整服务状态来展示情境感知能力。具体而言，智能体应回忆Honda
  Accord已确认的服务预约安排在11月24日星期五上午8点，地点为Firestone，服务内容为30K服务包，折扣后费用为$369.99（确认号FS-447291），而Tesla Model 3在第二次对话中被提及但实际未安排服务——仅提到了一般维护时间线。理想的回应应呈现两辆车的信息，然后询问用户希望为哪辆车安排服务，展示适当的消歧技能，而非假设或仅提供一辆车的部分信息。

  '
expected_behavior: 智能体应识别歧义，提及用户同时拥有已安排11月24日服务的Honda Accord和未安排服务的Tesla Model 3，然后询问哪辆车需要服务
