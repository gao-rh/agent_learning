:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {

  padding: 0;

  cursor: var(--cursor-interaction, pointer);

  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),

  background-position:

  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {

}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;business-analysis-topology&quot; class=&quot;bat-root&quot;&gt;
  &lt;style&gt;
    #business-analysis-topology {
      color: var(--foreground);
      width: 100%;
    }

    #business-analysis-topology .bat-heading {
      margin: 0 0 0.75rem;
      font-weight: 500;
    }

    #business-analysis-topology .bat-core {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.35fr) auto minmax(0, 1.35fr);
      align-items: stretch;
      gap: 0.5rem;
      margin-bottom: 0.9rem;
    }

    #business-analysis-topology .bat-node {
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-left: 4px solid var(--viz-series-1);
      border-radius: 0.5rem;
      background: color-mix(in srgb, var(--viz-series-1) 10%, transparent);
      min-width: 0;
    }

    #business-analysis-topology .bat-node strong,
    #business-analysis-topology .bat-step-copy strong,
    #business-analysis-topology .bat-shared strong {
      display: block;
      font-weight: 500;
      margin-bottom: 0.2rem;
    }

    #business-analysis-topology .bat-arrow {
      align-self: center;
      color: var(--muted-foreground);
      font-weight: 500;
    }

    #business-analysis-topology .bat-controls-label {
      margin: 0 0 0.45rem;
    }

    #business-analysis-topology .bat-view {
      margin-top: 1rem;
    }

    #business-analysis-topology .bat-view h3 {
      margin: 0 0 0.25rem;
      font-weight: 500;
    }

    #business-analysis-topology .bat-view-note {
      margin: 0 0 0.75rem;
    }

    #business-analysis-topology .bat-steps {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #business-analysis-topology .bat-step {
      display: grid;
      grid-template-columns: 2.25rem minmax(0, 1fr);
      gap: 0.65rem;
      position: relative;
      padding-bottom: 0.65rem;
    }

    #business-analysis-topology .bat-step:not(:last-child)::after {
      content: &quot;&quot;;
      position: absolute;
      left: 1.08rem;
      top: 2rem;
      bottom: 0.05rem;
      border-left: 1px solid var(--border);
    }

    #business-analysis-topology .bat-step-index {
      display: grid;
      place-items: center;
      align-self: start;
      width: 2.15rem;
      height: 2.15rem;
      border-radius: 50%;
      background: var(--primary);
      color: var(--primary-foreground);
      font-weight: 500;
    }

    #business-analysis-topology .bat-step-copy {
      padding: 0.55rem 0 0.7rem;
      border-bottom: 1px solid var(--border);
      min-width: 0;
    }

    #business-analysis-topology .bat-shared-wrap {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
      margin-top: 0.9rem;
    }

    #business-analysis-topology .bat-shared {
      padding: 0.7rem 0;
      border-top: 2px solid var(--border);
    }

    @media (max-width: 620px) {
      #business-analysis-topology .bat-core {
        grid-template-columns: minmax(0, 1fr);
      }

      #business-analysis-topology .bat-arrow {
        justify-self: center;
        transform: rotate(90deg);
      }

      #business-analysis-topology .bat-shared-wrap {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  &lt;/style&gt;

  &lt;h2 class=&quot;bat-heading&quot;&gt;智能经营分析 Agent 拓扑&lt;/h2&gt;

  &lt;div class=&quot;bat-core&quot; role=&quot;img&quot; aria-label=&quot;用户请求进入主 Agent，再由受控编排器管理状态和专业执行路径&quot;&gt;
    &lt;div class=&quot;bat-node&quot;&gt;
      &lt;strong&gt;用户&lt;/strong&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;提问、补充信息、接收结果&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;bat-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
    &lt;div class=&quot;bat-node&quot;&gt;
      &lt;strong&gt;主 Agent&lt;/strong&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;意图、澄清、上下文组装、高层计划、最终回复&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;bat-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
    &lt;div class=&quot;bat-node&quot;&gt;
      &lt;strong&gt;受控编排器&lt;/strong&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;状态、路由、准入、重试、超时与停止&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;p class=&quot;bat-controls-label text-small text-muted&quot;&gt;选择一条链路查看细节&lt;/p&gt;
  &lt;div class=&quot;viz-controls&quot; role=&quot;group&quot; aria-label=&quot;选择拓扑链路&quot;&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-bat-view=&quot;overview&quot; aria-pressed=&quot;true&quot;&gt;总览&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-bat-view=&quot;consult&quot; aria-pressed=&quot;false&quot;&gt;口径咨询&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-bat-view=&quot;query&quot; aria-pressed=&quot;false&quot;&gt;取数&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-bat-view=&quot;analysis&quot; aria-pressed=&quot;false&quot;&gt;分析&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-bat-view=&quot;fallback&quot; aria-pressed=&quot;false&quot;&gt;通用兜底&lt;/button&gt;
  &lt;/div&gt;

  &lt;section class=&quot;bat-view&quot; aria-live=&quot;polite&quot; aria-labelledby=&quot;bat-view-title&quot;&gt;
    &lt;h3 id=&quot;bat-view-title&quot;&gt;总览&lt;/h3&gt;
    &lt;p id=&quot;bat-view-note&quot; class=&quot;bat-view-note text-small text-muted&quot;&gt;主 Agent 统一对话与规划，受控编排器把任务送入四条边界清晰的路径。&lt;/p&gt;
    &lt;ol id=&quot;bat-view-steps&quot; class=&quot;bat-steps&quot;&gt;
      &lt;li class=&quot;bat-step&quot;&gt;
        &lt;span class=&quot;bat-step-index&quot; aria-hidden=&quot;true&quot;&gt;1&lt;/span&gt;
        &lt;div class=&quot;bat-step-copy&quot;&gt;&lt;strong&gt;口径咨询&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;主 Agent 直接调用只读元数据工具。&lt;/span&gt;&lt;/div&gt;
      &lt;/li&gt;
      &lt;li class=&quot;bat-step&quot;&gt;
        &lt;span class=&quot;bat-step-index&quot; aria-hidden=&quot;true&quot;&gt;2&lt;/span&gt;
        &lt;div class=&quot;bat-step-copy&quot;&gt;&lt;strong&gt;取数&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;QuerySpec 交给取数 Agent，输出可校验的数据证据。&lt;/span&gt;&lt;/div&gt;
      &lt;/li&gt;
      &lt;li class=&quot;bat-step&quot;&gt;
        &lt;span class=&quot;bat-step-index&quot; aria-hidden=&quot;true&quot;&gt;3&lt;/span&gt;
        &lt;div class=&quot;bat-step-copy&quot;&gt;&lt;strong&gt;经营分析&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;AnalysisTask 交给分析 Agent，内部完成规划、取数、可视化和报告。&lt;/span&gt;&lt;/div&gt;
      &lt;/li&gt;
      &lt;li class=&quot;bat-step&quot;&gt;
        &lt;span class=&quot;bat-step-index&quot; aria-hidden=&quot;true&quot;&gt;4&lt;/span&gt;
        &lt;div class=&quot;bat-step-copy&quot;&gt;&lt;strong&gt;通用兜底&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;只做能力探索、澄清与重路由，不直接绕过专业 Agent。&lt;/span&gt;&lt;/div&gt;
      &lt;/li&gt;
    &lt;/ol&gt;
  &lt;/section&gt;

  &lt;div class=&quot;bat-shared-wrap&quot;&gt;
    &lt;div class=&quot;bat-shared&quot;&gt;
      &lt;strong&gt;共享上下文、知识与记忆&lt;/strong&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;会话状态、用户信息与偏好、业务知识、业务事件、历史分析经验、Skill 与报告模板&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;bat-shared&quot;&gt;
      &lt;strong&gt;横切控制&lt;/strong&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;指标与证据校验、权限、Trace、审计、checkpoint、重试上限与成本预算&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;business-analysis-topology&#x27;);
      if (!root) return;

      const views = {
        overview: {
          title: &#x27;总览&#x27;,
          note: &#x27;主 Agent 统一对话与规划，受控编排器把任务送入四条边界清晰的路径。&#x27;,
          steps: [
            [&#x27;口径咨询&#x27;, &#x27;主 Agent 直接调用只读元数据工具。&#x27;],
            [&#x27;取数&#x27;, &#x27;QuerySpec 交给取数 Agent，输出可校验的数据证据。&#x27;],
            [&#x27;经营分析&#x27;, &#x27;AnalysisTask 交给分析 Agent，内部完成规划、取数、可视化和报告。&#x27;],
            [&#x27;通用兜底&#x27;, &#x27;只做能力探索、澄清与重路由，不直接绕过专业 Agent。&#x27;]
          ]
        },
        consult: {
          title: &#x27;口径咨询链路&#x27;,
          note: &#x27;它是一类独立意图，但不新增独立咨询 Agent。&#x27;,
          steps: [
            [&#x27;主 Agent 识别咨询对象&#x27;, &#x27;判断用户问的是指标定义、维度、更新时间、来源还是质量。&#x27;],
            [&#x27;必要时澄清&#x27;, &#x27;指标或术语存在歧义时，由主 Agent 继续与用户交互。&#x27;],
            [&#x27;只读元数据工具&#x27;, &#x27;查询标准指标名、公式、支持维度、更新状态、数据来源和质量信息。&#x27;],
            [&#x27;口径证据&#x27;, &#x27;保留权威来源和标准身份，避免模型仅凭语言生成。&#x27;],
            [&#x27;主 Agent 回复&#x27;, &#x27;根据证据组织解释；用户继续要求查数时，再转入取数链路。&#x27;]
          ]
        },
        query: {
          title: &#x27;取数链路&#x27;,
          note: &#x27;模型负责理解与恢复，平台负责准入、校验和停止边界。&#x27;,
          steps: [
            [&#x27;主 Agent 澄清&#x27;, &#x27;确认标准指标、时间、维度、筛选条件和对比方式。&#x27;],
            [&#x27;组装 QuerySpec&#x27;, &#x27;把已确认条件转换为取数 Agent 的结构化任务。&#x27;],
            [&#x27;取数 Agent&#x27;, &#x27;在受限工具集合内选择调用方式，不自行编造指标或数据。&#x27;],
            [&#x27;数据工具与接口&#x27;, &#x27;日期周期脚本、指标接口、复合指标计算、公司数据接口与缓存。&#x27;],
            [&#x27;DataEvidence 校验&#x27;, &#x27;检查指标身份、业务适用性、时间、完整性和数据质量。&#x27;],
            [&#x27;主 Agent 回复&#x27;, &#x27;校验通过后返回数值、口径与必要的证据边界。&#x27;]
          ]
        },
        analysis: {
          title: &#x27;经营分析链路&#x27;,
          note: &#x27;固定分析和开放分析共用一个分析 Agent，只是加载的 Skill 不同。&#x27;,
          steps: [
            [&#x27;主 Agent 澄清与选路&#x27;, &#x27;明确分析目标、指标、渠道、时间和问题类型。&#x27;],
            [&#x27;组装 AnalysisTask&#x27;, &#x27;加入任务边界、相关上下文、业务知识、输出要求和固定或开放分析 Skill。&#x27;],
            [&#x27;分析 Agent 详细规划&#x27;, &#x27;自主决定下钻顺序和取数子任务；固定模式受计划模板约束，未命中时加载开放分析 Skill。&#x27;],
            [&#x27;调用取数 Agent&#x27;, &#x27;每一个取数子任务仍走统一 QuerySpec、受控工具和 DataEvidence 校验。&#x27;],
            [&#x27;解释证据并迭代&#x27;, &#x27;根据中间结果决定继续下钻、调整计划或停止，受循环次数和预算限制。&#x27;],
            [&#x27;计算与可视化&#x27;, &#x27;使用计算、画图 Tool 和可视化 Skill 生成与证据一致的图表。&#x27;],
            [&#x27;报告撰写&#x27;, &#x27;根据报告 Skill、参考格式和模板组织结论、证据及未解决项。&#x27;],
            [&#x27;报告校验与交付&#x27;, &#x27;检查标准指标名、数值一致、证据引用和格式，再交给主 Agent 封装。&#x27;]
          ]
        },
        fallback: {
          title: &#x27;通用兜底链路&#x27;,
          note: &#x27;兜底 Agent 的目标是重新找到受控路径，不是成为拥有全部工具的万能 Agent。&#x27;,
          steps: [
            [&#x27;意图没有命中&#x27;, &#x27;已知三类意图无法覆盖，或多个候选仍无法消歧。&#x27;],
            [&#x27;能力探索与重路由 Agent&#x27;, &#x27;理解目标、拆解问题并查询当前系统能力。&#x27;],
            [&#x27;能力目录&#x27;, &#x27;查看可用 Agent、Skill、工具说明、适用条件和权限。&#x27;],
            [&#x27;重新路由或继续澄清&#x27;, &#x27;能够转化时回到口径咨询、取数或分析链路。&#x27;],
            [&#x27;明确能力边界&#x27;, &#x27;无法转化时说明当前不能完成，不直接调用底层取数工具。&#x27;]
          ]
        }
      };

      const title = root.querySelector(&#x27;#bat-view-title&#x27;);
      const note = root.querySelector(&#x27;#bat-view-note&#x27;);
      const steps = root.querySelector(&#x27;#bat-view-steps&#x27;);
      const buttons = Array.from(root.querySelectorAll(&#x27;[data-bat-view]&#x27;));

      const render = (key) =&gt; {
        const view = views[key];
