<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>业务知识库与分析 Skill</title><style>body{font:15px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;margin:auto;max-width:1050px;padding:28px;background:#f4f7f2;color:#25382d}article,details{background:white;border:1px solid #d8e3d7;border-radius:10px;padding:18px;margin:14px 0}pre{white-space:pre-wrap;font:inherit}a{color:#286a45}input{font:inherit;padding:8px;min-width:280px}summary{cursor:pointer;font-weight:600}.muted{color:#6b776e;font-size:13px}</style><a href="/">← 对话</a> · <a href="/usage">Token 用量</a><h1>业务知识库与分析 Skill</h1><p>指标精确口径仍由右侧指标目录提供。这里是专题方法和适用范围；来源于当前项目手册及本地模拟配置。关键词/别名检索，没有调用 embedding。</p><input id="q" placeholder="试试：渠道归因、保费、渗透率"><button id="search">搜索</button><div id="docs"></div><h2>实际加载的四份 Skill</h2><div id="skills"></div><script>const el=(t,s)=>{let e=document.createElement(t);e.textContent=s;return e;};async function load(){const r=await fetch('/api/knowledge?q='+encodeURIComponent(document.querySelector('#q').value));const s=await r.json();const d=document.querySelector('#docs');d.replaceChildren();for(const x of s.documents){const a=el('article','');a.append(el('h2',x.title),el('p',x.source+' · '+x.evidence_status),el('pre',x.text),el('p','推荐指标ID：'+x.metric_ids.join('、')));d.append(a);}if(!s.documents.length)d.append(el('p','没有匹配的业务知识。'));const b=document.querySelector('#skills');b.replaceChildren();for(const [k,v]of Object.entries(s.skills)){const e=el('details','');e.append(el('summary',k),el('pre',v));b.append(e);}}document.querySelector('#search').onclick=load;load();</script></html>
